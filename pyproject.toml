[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdshift"
version = "0.1.0"
description = "A scheduler that keeps work queued ahead of every worker and leaves a morning brief"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["thirdshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
